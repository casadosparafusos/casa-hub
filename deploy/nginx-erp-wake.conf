# /etc/nginx/sites-available/erp-wake
#
# Casa Hub saiu do ecossistema do Portal Interno em 03/09/2026 (vai operar
# num servidor 24/7 separado no futuro; por ora continua neste servidor,
# so em horario comercial). A partir de agora o proprio app faz login/
# sessao (ver src/lib/auth.ts, middleware via layout do grupo (app)) --
# entao nao ha mais auth_request pro Portal, nem proxy dos assets
# compartilhados /_portal/shared/. Proxy direto e simples.
#
# Porta externa 8083 (inalterada), porta interna 3001 (inalterada).

server {
    listen 8083;
    server_name _;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
